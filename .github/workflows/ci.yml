name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make CXXFLAGS="-std=c++11 -O2 -Wall"
      - name: Test (unit + golden)
        run: timeout 300 make test
      - name: Run the demo
        run: timeout 60 make demo
